# OpenFlux local runner. One image, two mutually independent services —
# the two ends never talk to each other directly; they meet on the transport
# channel (the Yandex doc / the MAX call). Start only the end you need:
#
#   docker compose --profile client     up -d --build   # SOCKS5 on 127.0.0.1:1080
#   docker compose --profile exit-node  up -d --build
#
# Configure via .env (see .env.example) or inline env vars:
#   DOC_URL=... MAX_TOKEN=... MAX_UID=... TRANSPORT=vyandex docker compose --profile client up -d
#
# Privileges, deliberately asymmetric:
#   client     — none. It dials out like a browser and serves SOCKS5 locally.
#   exit-node  — defaults to MODE=l3 (raw-socket forwarding), so it needs
#                cap_add below (NET_RAW for the raw socket, NET_ADMIN for the
#                scoped kernel-RST-drop rule, confined to this container's
#                netns). Set MODE=l4 for the unprivileged backend instead --
#                drop the cap_add too if you do, it won't be needed.

services:
  client:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [client]
    environment:
      ROLE: client
      TRANSPORT: ${TRANSPORT:-yandex}
      URL: ${DOC_URL:-}
      MAX_TOKEN: ${MAX_TOKEN:-}
      MAX_UID: ${MAX_UID:-}
      SOCKS5_LISTEN: ${SOCKS5_LISTEN:-:1080}
      DEBUG: ${DEBUG:-0}
    # No auth on the SOCKS5 server — keep it bound to the host loopback only.
    ports:
      - "127.0.0.1:1080:1080"

  exit-node:
    build: .
    image: openflux:local
    restart: unless-stopped
    profiles: [exit-node]
    environment:
      ROLE: exit-node
      TRANSPORT: ${TRANSPORT:-yandex}
      URL: ${DOC_URL:-}
      MAX_TOKEN: ${MAX_TOKEN:-}
      MAX_UID: ${MAX_UID:-}
      LOCAL_IP: ${EXIT_LOCAL_IP:-}
      MODE: ${MODE:-l3}
      DEBUG: ${DEBUG:-0}
    cap_add:
      - NET_RAW
      - NET_ADMIN

  admin-ui:
    build: ./admin-ui
    image: openflux-admin-ui:local
    restart: unless-stopped
    profiles: [admin-ui]
    environment:
      ADMIN_UI_USER: ${ADMIN_UI_USER:-admin}
      ADMIN_UI_PASSWORD: ${ADMIN_UI_PASSWORD:?set ADMIN_UI_PASSWORD before starting admin-ui}
      ADMIN_UI_PORT: ${ADMIN_UI_PORT:-9027}
      OPENFLUX_IMAGE: ${OPENFLUX_IMAGE:-openflux-exit:local}
    ports:
      - "127.0.0.1:${ADMIN_UI_PORT:-9027}:9027"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cli/state:/state
